<toolbar brighttext="true"
  id="enso-sidebar-foot-buttons"
  fullscreentoolbar="true"
  class="browser-toolbar customization-target"
  data-l10n-id="tabs-toolbar"
  customizable="true"
  skipintoolbarset="true"
  context="toolbar-context-menu"
  mode="icons">

  <enso-workspace-icons id="enso-workspaces-button" overflows="false" removable="false"></enso-workspace-icons>
  <toolbarbutton removable="true" class="chromeclass-toolbar-additional toolbarbutton-1 enso-sidebar-action-button" id="enso-create-new-button" context="ensoCreateNewPopup" data-l10n-id="sidebar-enso-create-new"></toolbarbutton>
</toolbar>
